networks:
  front-network:
    driver: overlay
  mqtt-network:
    driver: overlay
  rp-network:
    driver: overlay
 
 
configs:
  nginx_conf:
    external: true
  nginx_snippets_oauth2:
    external: true
  mosquitto_conf:
    external: true
  kc_cm_realm:
    external: true
  oauth2_proxy_cfg:
    external: true
 
secrets:
  nginx_cert:
    external: true
  nginx_key:
    external: true
  kc_admin_password:
    external: true
  kc_db_password:
    external: true
  postgres_password:
    external: true
  oauth2_proxy_client_secret:
    external: true
  oauth2_proxy_cookie_secret:
    external: true
  grafana_password:
    external: true
 
services:
 
  static-server-backend:
    image: clubmanagersirius/static-server-backend:${IMAGE_TAG:-latest}
    ports:
      - "3000:80"
    networks:
      - front-network
    deploy:
      placement:
        constraints:
          - node.labels.role == front
 
  entrance-cockpit-backend:
    image: clubmanagersirius/entrance-cockpit-backend:${IMAGE_TAG:-latest}
    ports:
      - "8082:8082"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=192.168.0.50:9092
      - POSTGRES_SERVER=192.168.0.33:5432
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - front-network
    deploy:
      placement:
        constraints:
          - node.labels.role == front
 
  player-performance-backend:
    image: clubmanagersirius/player-performance-backend:${IMAGE_TAG:-latest}
    ports:
      - "8081:8081"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=192.168.0.50:9092
    deploy:
      placement:
        constraints:
          - node.labels.role == performance-backend
 
  team-performance-backend:
    image: clubmanagersirius/team-performance-backend:${IMAGE_TAG:-latest}
    ports:
      - "8083:8083"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=192.168.0.50:9092
    deploy:
      placement:
        constraints:
          - node.labels.role == performance-backend
 
  bridge-messaging:
    image: clubmanagersirius/bridge-messaging:${IMAGE_TAG:-latest}
    environment:
      - KAFKA_BOOTSTRAP=192.168.0.50:9092
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    networks:
      - mqtt-network
    deploy:
      placement:
        constraints:
          - node.labels.role == mqtt-bridge
 
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    configs:
      - source: mosquitto_conf
        target: /mosquitto/config/mosquitto.conf
    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    networks:
      - mqtt-network
    deploy:
      placement:
        constraints:
          - node.labels.role == mqtt-bridge
 
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
      - "8883:8883"
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf
      - source: nginx_snippets_oauth2
        target: /etc/nginx/snippets/oauth2_headers.conf
    secrets:
      - source: nginx_cert
        target: /etc/nginx/ssl/cert.pem
      - source: nginx_key
        target: /etc/nginx/ssl/privkey.pem
    networks:
      - rp-network
      - front-network
    deploy:
      placement:
        constraints:
          - node.labels.role == reverse-proxy
 
  redis:
    image: redis:7-alpine
    networks:
      - rp-network
    deploy:
      placement:
        constraints:
          - node.labels.role == reverse-proxy
 
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    # --cookie-secret-file n'existe pas dans v7.6.0 : on passe par un fichier de config
    # monté via Docker config. Le client_secret lui supporte --client-secret-file.
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
      - --client-secret-file=/run/secrets/oauth2_proxy_client_secret
    configs:
      - source: oauth2_proxy_cfg
        target: /etc/oauth2-proxy/oauth2-proxy.cfg
        mode: 0444
    secrets:
      - oauth2_proxy_client_secret
    networks:
      - rp-network
    deploy:
      placement:
        constraints:
          - node.labels.role == reverse-proxy
 
  data-pipeline:
    image: clubmanagersirius/data-pipeline:${IMAGE_TAG:-latest}
    deploy:
      placement:
        constraints:
          - node.labels.role == etl
 
  identity-provider:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - "8080:8080"
    configs:
      - source: kc_cm_realm
        target: /opt/keycloak/data/import/cm-realm-realm.json
    environment:
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME=172.31.249.162
      - KC_HOSTNAME_STRICT=false
      - KC_PROXY_HEADERS=xforwarded
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://192.168.0.33:5432/keycloak
      - KC_DB_USERNAME=keycloak
    secrets:
      - kc_admin_password
      - kc_db_password
    entrypoint:
      - bash
      - -c
      - |
        export KC_BOOTSTRAP_ADMIN_PASSWORD=$$(cat /run/secrets/kc_admin_password)
        export KC_DB_PASSWORD=$$(cat /run/secrets/kc_db_password)
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    networks:
      - rp-network
    deploy:
      placement:
        constraints:
          - node.labels.role == idp
 
  grafana:
    image: grafana/grafana-oss:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_password
      - GF_SERVER_ROOT_URL=https://172.31.249.162/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    secrets:
      - grafana_password
    volumes:
      - grafana_data:/var/lib/grafana
    deploy:
      placement:
        constraints:
          - node.labels.role == etl
 
 
volumes:
  mqtt_data:
  mqtt_log:
  grafana_data:
 