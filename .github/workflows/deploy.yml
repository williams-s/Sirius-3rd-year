name: Deploy

on:
  push:
    branches:
      - dev
      #- main

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set IMAGE_TAG
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build & Push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./static-server
          push: true
          build-args: |
            VITE_ENTRANCE_COCKPIT_SERVER=https://172.31.249.162
          tags: |
            clubmanagersirius/static-server-backend:${{ env.IMAGE_TAG }}
            clubmanagersirius/static-server-backend:latest
      - name: Build & Push entrance-cockpit
        uses: docker/build-push-action@v4
        with:
          context: .
          file: entrance-cockpit/Dockerfile
          push: true
          tags: |
            clubmanagersirius/entrance-cockpit-backend:${{ env.IMAGE_TAG }}
            clubmanagersirius/entrance-cockpit-backend:latest

      - name: Build & Push bridge-messaging
        uses: docker/build-push-action@v4
        with:
          context: ./bridge-messaging
          push: true
          tags: |
            clubmanagersirius/bridge-messaging:${{ env.IMAGE_TAG }}
            clubmanagersirius/bridge-messaging:latest

  deploy-dev:
    needs: build-and-push
    #if: github.ref == 'refs/heads/dev'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set IMAGE_TAG
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Deploy Stack Dev
        run: IMAGE_TAG=${{ env.IMAGE_TAG }} docker stack deploy -c docker-stack-dev.yml club_manager_dev --with-registry-auth

  deploy-prod:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set IMAGE_TAG
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Deploy Stack Prod
        run: IMAGE_TAG=${{ env.IMAGE_TAG }} docker stack deploy -c docker-stack-prod.yml club_manager_prod --with-registry-auth