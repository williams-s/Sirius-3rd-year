events {}

http {
    upstream oauth2_proxy {
        server oauth2-proxy:4180;
    }

    upstream static-server {
        server 192.168.0.80:3000;
    }

    upstream entrance-cockpit {
        server 192.168.0.80:8082;
    }

    proxy_buffer_size       128k;
    proxy_buffers           8 256k;
    proxy_busy_buffers_size 256k;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /oauth2/ {
            proxy_pass http://oauth2_proxy;
        }

        location = /oauth2/auth {
            internal;
            proxy_pass http://oauth2_proxy/oauth2/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location = /oauth2/start {
            proxy_pass http://oauth2_proxy/oauth2/start;
        }

        location = /oauth2/callback {
            proxy_pass http://oauth2_proxy/oauth2/callback;
        }

        location / {
            include snippets/oauth2_headers.conf;
            proxy_pass http://static-server;
        }

        location /api/ {
            include snippets/oauth2_headers.conf;
            proxy_pass http://entrance-cockpit;
        }

        location /ws/ {
            include snippets/oauth2_headers.conf;
            proxy_pass http://entrance-cockpit;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/mock/ {
            proxy_pass http://entrance-cockpit;
        }
    }
}